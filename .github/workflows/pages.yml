name: Mikis13 EdgeHub Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mikis13-edgehub-pages
  cancel-in-progress: false

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: EdgeHub self-test
        run: |
          chmod +x tools/self-test.sh
          ./tools/self-test.sh

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build information
        run: |
          mkdir -p data

          SHORT="$(git rev-parse --short HEAD)"
          FULL="$(git rev-parse HEAD)"
          GENERATED="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          cat > data/build-info.json <<JSON
          {
            "commit":"$FULL",
            "short_commit":"$SHORT",
            "generated":"$GENERATED",
            "platform":"GitHub Pages",
            "engine":"Mikis13 EdgeHub"
          }
          JSON

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
